name: Wikipedia Scraper

on:
  # Each run dispatches its successor as its last step, so the crawl is
  # effectively continuous.  This cron is only a watchdog: if a run dies before
  # it can chain (runner loss, cancellation), it restarts the chain.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages to scrape in this run'
        required: false
        default: '100000'
      workers:
        description: 'Parallel fetch workers'
        required: false
        default: '5'
      max_seconds:
        description: 'Wall-clock budget for the crawl itself'
        required: false
        default: '10800'
      reset:
        description: 'Discard the whole URL store and crawl from scratch'
        type: boolean
        required: false
        default: false
      chain:
        description: 'Dispatch the next run when this one finishes (uncheck for a one-off run)'
        type: boolean
        required: false
        default: true

# Never let two crawls run at once: they would write conflicting chunks and
# race each other pushing to main.
concurrency:
  group: wikipedia-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      contents: write
      actions: write   # required to dispatch the successor run

    steps:
      # The full checkout is the crawl state: urls/ holds every known URL as
      # immutable zip chunks.  depth=1 keeps the clone to the current tree only.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Used by the chaining step to detect a crash-loop (see below).
      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev libzip-dev

      - name: Build scraper
        run: g++ -std=c++23 -O2 -Wall -pthread scraper.cpp -lcurl -lzip -o scraper

      - name: Show store before the crawl
        run: |
          v=$(ls urls/visited/*.zip 2>/dev/null | wc -l)
          q=$(ls urls/queue/*.zip 2>/dev/null | wc -l)
          echo "visited chunks: $v   queue chunks: $q   on disk: $(du -sh urls 2>/dev/null | cut -f1)"
          if [ "$v" -eq 0 ] && [ "$q" -eq 0 ]; then
            echo "::warning::No URL chunks in the checkout; the crawl will start from the seed URL."
          fi

      # There is no cache and no database: the repository IS the state.  The
      # scraper loads every chunk, crawls, and writes only NEW chunks.
      - name: Run scraper
        id: scrape
        env:
          MAX_PAGES: ${{ inputs.max_pages || '100000' }}
          WORKERS: ${{ inputs.workers || '5' }}
          MAX_SECONDS: ${{ inputs.max_seconds || '10800' }}
          RESET: ${{ inputs.reset }}
        run: |
          if [ "$RESET" = "true" ]; then
            echo "Reset requested; discarding the store and starting fresh."
            rm -rf urls state/scraper_state.dat
            ./scraper --wikipedia "$MAX_PAGES" --workers "$WORKERS" --max-seconds "$MAX_SECONDS"
          else
            ./scraper --resume "$MAX_PAGES" --workers "$WORKERS" --max-seconds "$MAX_SECONDS"
          fi

      # Chunks are immutable once committed, so a run only ever ADDS files.
      # Guard that invariant here: if a tracked chunk was modified or deleted,
      # something is wrong and committing it would corrupt the store.
      - name: Verify chunk immutability
        if: always() && steps.scrape.outcome == 'success'
        run: |
          changed=$(git diff --name-only --diff-filter=MD -- urls/ | head -20)
          if [ -n "$changed" ]; then
            echo "::error::Existing chunks were modified or deleted:"
            echo "$changed"
            exit 1
          fi
          added=$(git ls-files --others --exclude-standard -- urls/ | wc -l)
          echo "New chunks this run: $added"
          if [ "$added" -gt 0 ]; then
            git ls-files --others --exclude-standard -- urls/ | head -10
            echo "Largest new chunk:"
            git ls-files --others --exclude-standard -- urls/ \
              | xargs -r stat -c '%s %n' | sort -rn | head -1 \
              | awk '{printf "  %.1f MB  %s\n", $1/1048576, $2}'
          fi

      - name: Commit and push results
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for attempt in 1 2 3; do
            git add state/scraper_state.dat scraper_results.txt
            git add -- urls/
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore: update scraper data [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            # A rebase is not dependable on a shallow clone, so re-anchor onto
            # the new remote tip instead.  Because chunks are immutable and
            # named by sequence, a concurrent run can only have ADDED files;
            # our own new chunks stay untracked across the reset and re-commit.
            echo "Push rejected; re-anchoring onto the current origin/$GITHUB_REF_NAME"
            git fetch --depth=1 --no-tags origin "$GITHUB_REF_NAME"
            git reset FETCH_HEAD
          done
          echo "::error::Failed to push results after 3 attempts"
          exit 1

      # Start the next crawl immediately instead of waiting for the cron.
      # A push made with GITHUB_TOKEN never triggers a workflow, so `on: push`
      # cannot chain; workflow_dispatch is the documented exception.
      #
      # Only chains when the crawl succeeded, so a broken build or failing crawl
      # stops the chain rather than spinning.  The floor delay covers a crawl
      # that exits successfully in seconds (e.g. an exhausted frontier).
      - name: Chain the next run
        # `inputs.chain != false` would be wrong: on a scheduled run `inputs` is
        # null, and GitHub casts both null and false to 0, so it would compare
        # equal and the watchdog run would never restart the chain.
        if: ${{ always() && steps.scrape.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.chain) }}
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_CYCLE_SECONDS: '600'
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED_AT ))
          if [ "$elapsed" -lt "$MIN_CYCLE_SECONDS" ]; then
            wait=$(( MIN_CYCLE_SECONDS - elapsed ))
            echo "Run took only ${elapsed}s; waiting ${wait}s before chaining."
            sleep "$wait"
          fi
          echo "Dispatching the next run on $GITHUB_REF_NAME"
          gh workflow run scraper.yml --ref "$GITHUB_REF_NAME"
