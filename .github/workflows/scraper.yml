name: Wikipedia Scraper

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run Wikipedia scraper
        run: |
          # Run scraper with resume flag to continue from where it left off
          # Limit to 50 pages per run to avoid timeout
          python scrape_wikipedia.py --resume 50 || python scrape_wikipedia.py 50
        continue-on-error: false
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push results
        run: |
          # Add the state and results files
          git add scraper_state.json scraper_results.txt
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update scraper data [skip ci]"
            git push
          fi
